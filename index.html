  var mainSelection = { renderId: null, drawingId: null, switcher: { render: false, drawing: false } };
  function bindMainPage() {
    var pid = getDefaultProjectId();
    // Reset on every visit to the home page — upload windows always start empty.
    mainSelection = { renderId: null, drawingId: null, switcher: { render: false, drawing: false } };

    function refreshSidebar() {
      var wrap = document.getElementById("sidebar-container");
      wrap.innerHTML =
        AssetPicker("Рендер", "render", pid, mainSelection.renderId, mainSelection.switcher.render) +
        AssetPicker("Креслення", "drawing", pid, mainSelection.drawingId, mainSelection.switcher.drawing) +
        '<button class="btn btn-primary" id="run-analysis-btn" style="width:100%;">Перевірити</button>';

      function handleIncomingFile(file, kind) {
        function addAsset(dataUrl, name, pageText, userCropped) {
          var id = nextId("asset");
          var asset = { id: id, project_id: pid, kind: kind, name: name, dataUrl: dataUrl };
          if (pageText) asset.pdfText = pageText;
          // The user framed the elevation herself — never let auto-crop override that choice.
          if (userCropped) asset.userCropped = true;
          state.assets.unshift(asset);
          idbPutBlob(id, dataUrl, pageText).catch(function () {});
          if (kind === "render") mainSelection.renderId = id; else mainSelection.drawingId = id;
          mainSelection.switcher[kind] = false;
          saveState();
          refreshSidebar();
          toast(pageText ? "Сторінку взято разом із текстовим шаром." : "Файл завантажено.");
        }
        if (isDwgFile(file)) {
          toast("DWG напряму не читається в браузері. Експортуйте елевацію в PDF або PNG/JPG (наприклад через ODA File Converter) і завантажте цей файл.");
          return;
        }
        if (isPdfFile(file)) {
          // If a render is already chosen, use its filename to auto-locate the matching plan.
          var selectedRender = findAsset(mainSelection.renderId);
          var plans = kind === "drawing" && selectedRender ? planNameFromRenderName(selectedRender.name) : null;
          var style = kind === "drawing" && selectedRender ? elevationStyleFromRenderName(selectedRender.name) : null;
          openPdfPagePicker(file, function (dataUrl, label, pageText, userCropped) {
            addAsset(dataUrl, label, pageText, userCropped);
          }, plans, style);
          return;
        }
        fileToResizedDataUrl(file, 2400, function (dataUrl) { addAsset(dataUrl, file.name); });
      }

      wrap.querySelectorAll("[data-toggle-switcher]").forEach(function (el) {
        el.onclick = function () {
          var kind = el.dataset.toggleSwitcher;
          mainSelection.switcher[kind] = !mainSelection.switcher[kind];
          refreshSidebar();
        };
      });
      wrap.querySelectorAll("[data-select-asset]").forEach(function (el) {
        el.onclick = function () {
          var kind = el.dataset.kind, id = Number(el.dataset.selectAsset);
          if (kind === "render") mainSelection.renderId = id; else mainSelection.drawingId = id;
          mainSelection.switcher[kind] = false;
          refreshSidebar();
        };
      });
      wrap.querySelectorAll("[data-upload-kind]").forEach(function (input) {
        input.onchange = function () {
          var file = input.files[0];
          input.value = "";
          if (!file) return;
          handleIncomingFile(file, input.dataset.uploadKind);
        };
      });
      wrap.querySelectorAll("[data-slot]").forEach(function (slot) {
        var kind = slot.dataset.slot;
        slot.addEventListener("dragover", function (e) { e.preventDefault(); slot.classList.add("dragover"); });
        slot.addEventListener("dragleave", function () { slot.classList.remove("dragover"); });
        slot.addEventListener("drop", function (e) {
          e.preventDefault();
          slot.classList.remove("dragover");
          var file = e.dataTransfer.files && e.dataTransfer.files[0];
          if (file) handleIncomingFile(file, kind);
        });
      });

      var runBtn = document.getElementById("run-analysis-btn");
      var settings = loadSettings();
      runBtn.textContent = settings.anthropicApiKey ? "Перевірити (🤖 реальний AI)" : "Перевірити (🎲 мок)";
      runBtn.onclick = async function () {
        if (!mainSelection.renderId || !mainSelection.drawingId) { toast("Оберіть і рендер, і креслення."); return; }
        var runId = nextId("run");
        var renderAsset = findAsset(mainSelection.renderId);
        var drawingAsset = findAsset(mainSelection.drawingId);
        var runObj = { id: runId, project_id: pid, render_asset_id: mainSelection.renderId, drawing_asset_id: mainSelection.drawingId, created_at: new Date().toISOString() };
        state.runs.unshift(runObj);

        var findings;
        var s = loadSettings();
        if (s.anthropicApiKey) {
          runBtn.disabled = true;
          runBtn.textContent = "🤖 Аналізуємо через Claude Vision…";
          try {
            var result = await callClaudeVision(drawingAsset, renderAsset, s, function (msg) {
              runBtn.textContent = msg;
            });
            findings = result.differences;
            runObj.uncertain_areas = result.uncertain_areas;
            runObj.summary = result.summary;

            runBtn.textContent = "🔎 Перевіряю координати…";
            var blankCount = 0;
            for (var bi = 0; bi < findings.length; bi++) {
              var f = findings[bi];
              var dBlank = f.drawing_bbox ? await regionIsBlank(drawingAsset.dataUrl, f.drawing_bbox) : false;
              var rBlank = f.render_bbox ? await regionIsBlank(renderAsset.dataUrl, f.render_bbox) : false;
              if (dBlank || rBlank) {
                blankCount++;
                f.blank_bbox = true;
                f.description = "⚠️ Рамка вказує на порожню ділянку " +
                  (dBlank && rBlank ? "обох зображень" : dBlank ? "креслення" : "рендера") +
                  " — координати ймовірно вигадані, перевірте вручну. " + f.description;
                f.confidence = Math.min(f.confidence, 0.4);
              }
            }
            if (blankCount > 0) {
              toast("Позначено " + blankCount + " знахідк" + (blankCount === 1 ? "у" : "и") + " з рамкою на порожньому місці — вони підсвічені як сумнівні.");
            }
            if (result.uncertain_areas.length > 0) {
              toast("AI позначив " + result.uncertain_areas.length + " област" + (result.uncertain_areas.length === 1 ? "ь" : "і") + " як неперевірні — вони показані окремо і не рахуються як помилки.");
            }
          } catch (err) {
            toast("Реальний AI недоступний (" + err.message + ") — використано мок-дані.");
            findings = runComparison(runId);
          }
        } else {
          findings = runComparison(runId);
        }

        findings.forEach(function (f) {
          var did = nextId("discrepancy");
          state.discrepancies.push(Object.assign({ id: did, run_id: runId, review_status: "unreviewed", is_user_added: false, created_at: new Date().toISOString() }, f));
        });
        saveState();
        navigate("/run/" + runId);
      };
    }

    function refreshHistory() {
      var wrap = document.getElementById("history-container");
      var runs = state.runs.filter(function (r) { return r.project_id === pid; })
        .sort(function (a, b) { return new Date(b.created_at) - new Date(a.created_at); });
      if (runs.length === 0) {
        wrap.innerHTML =
          '<div class="card" style="padding:24px; text-align:center;">' +
            '<p class="muted" style="margin-bottom:12px;">Перевірок ще не було. Завантажте рендер і креслення зліва й натисніть «Перевірити».</p>' +
            '<button class="btn btn-sm" id="seed-demo-btn">✨ Завантажити демо-дані</button>' +
          '</div>';
        var seedBtn = document.getElementById("seed-demo-btn");
        if (seedBtn) seedBtn.onclick = function () { seedDemoData(pid); refreshSidebar(); refreshHistory(); };
        return;
      }
      var rowsHtml = runs.map(function (r) {
        var m = calcMetrics(discrepanciesOf(r.id));
        var renderAsset = findAsset(r.render_asset_id);
        var thumb = renderAsset && renderAsset.dataUrl
          ? '<img src="' + renderAsset.dataUrl + '" style="width:44px; height:44px; object-fit:cover; border-radius:6px; flex-shrink:0;">'
          : '<div style="width:44px; height:44px; border-radius:6px; background:#f1f5f9; flex-shrink:0;"></div>';
        return '<li><div class="list-item" data-open-run="' + r.id + '">' +
          '<div class="row" style="gap:10px;">' + thumb +
            '<div><div style="font-weight:600; font-size:13px;">Перевірка #' + r.id + '</div>' +
            '<div class="faint" style="font-size:11px;">' + new Date(r.created_at).toLocaleString() + '</div></div>' +
          '</div>' +
          '<div class="row" style="gap:14px;">' +
            '<span class="muted" style="font-size:12px;">' + m.total + ' помилок</span>' +
            '<span class="badge" style="background:var(--brand-50); color:var(--brand-700);">F1 ' + m.f1.toFixed(2) + '</span>' +
          '</div>' +
        '</div></li>';
      }).join("");
      wrap.innerHTML =
        '<div class="row" style="justify-content:space-between; margin-bottom:8px;">' +
          '<span class="faint" style="font-size:11px;">Останні перевірки</span>' +
          '<a href="#/history" style="font-size:11px; color:var(--brand-600);">Уся історія та метрики F1 &rarr;</a>' +
        '</div>' +
        '<ul class="list card">' + rowsHtml + '</ul>';
      wrap.querySelectorAll("[data-open-run]").forEach(function (el) {
        el.onclick = function () { navigate("/run/" + el.dataset.openRun); };
      });
    }

    refreshSidebar();
    refreshHistory();
  }

  // ---------- Review page ----------
  function ImagePanel(label, asset, discs, bboxKey, activeId) {
    var boxes = discs.map(function (d) {
      var box = d[bboxKey];
      if (!box) return "";
      var color = STATUS_COLOR[d.review_status];
      var active = d.id === activeId;
      return '<rect x="' + (box.x*100) + '" y="' + (box.y*100) + '" width="' + (box.w*100) + '" height="' + (box.h*100) + '" ' +
        'fill="' + (active ? color+"33" : "transparent") + '" stroke="' + color + '" stroke-width="' + (active?1.3:0.7) + '" vector-effect="non-scaling-stroke" ' +
        'style="cursor:pointer;" data-select-disc="' + d.id + '"></rect>';
    }).join("");
    var imgHtml = asset && asset.dataUrl ? '<img src="' + asset.dataUrl + '">' : '<div class="empty">Немає зображення</div>';
    return (
      '<div class="card" style="overflow:hidden;">' +
        '<div class="imgpanel-head">' + esc(label) + '</div>' +
        '<div class="imgwrap">' + imgHtml +
          '<svg class="overlay" viewBox="0 0 100 100" preserveAspectRatio="none">' + boxes + '</svg>' +
        '</div>' +
      '</div>'
    );
  }
  function DiscCard(d, active) {
    var statusBadge = '<span class="badge" style="color:' + STATUS_COLOR[d.review_status] + '; background:' + STATUS_BG[d.review_status] + ';">' + STATUS_LABEL[d.review_status] + '</span>';
    var confOrManual = d.is_user_added ? "додано вручну" : ("Впевненість: " + Math.round(d.confidence * 100) + "%");
    return (
      '<div class="disc-card ' + (active ? "active" : "") + '" data-select-disc="' + d.id + '">' +
        '<div class="disc-top">' +
          '<div><div class="disc-name">' + esc(d.element_name) + '</div><div class="disc-type">' + esc(ERROR_TYPE_LABEL[d.error_type] || d.error_type) + '</div></div>' +
          statusBadge +
        '</div>' +
        '<p class="disc-desc">' + esc(d.description) + '</p>' +
        (d.drawing_evidence || d.render_evidence
          ? '<div style="margin-top:6px; padding-top:6px; border-top:1px dashed var(--border); font-size:11px; color:var(--muted); line-height:1.5;">' +
              (d.drawing_evidence ? '<div><b>Креслення:</b> ' + esc(d.drawing_evidence) + '</div>' : '') +
              (d.render_evidence ? '<div><b>Рендер:</b> ' + esc(d.render_evidence) + '</div>' : '') +
            '</div>'
          : '') +
        '<div class="disc-bottom">' +
          '<span class="faint" style="font-size:11px;">' + confOrManual + '</span>' +
          '<div class="row" style="gap:4px;" data-stop-select="1">' +
            '<button class="iconbtn ' + (d.review_status==="tp"?"on-tp":"") + '" title="True Positive" data-review="' + d.id + '" data-status="tp">✅</button>' +
            '<button class="iconbtn ' + (d.review_status==="fp"?"on-fp":"") + '" title="False Positive" data-review="' + d.id + '" data-status="fp">❌</button>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }
  function UncertainSection(run) {
    var areas = run.uncertain_areas || [];
    if (areas.length === 0) return "";
    var cards = areas.map(function (u) {
      return '<div class="disc-card" style="border-style:dashed; background:#fafafa;">' +
        '<div class="disc-name">' + esc(u.element_name) + '</div>' +
        '<div class="disc-type">' + esc(u.category || "") + '</div>' +
        '<p class="disc-desc">' + esc(u.reason) + '</p>' +
        '<div style="margin-top:6px; padding-top:6px; border-top:1px dashed var(--border); font-size:11px; color:var(--muted); line-height:1.5;">' +
          (u.drawing_observation ? '<div><b>Креслення:</b> ' + esc(u.drawing_observation) + '</div>' : '') +
          (u.render_observation ? '<div><b>Рендер:</b> ' + esc(u.render_observation) + '</div>' : '') +
        '</div>' +
      '</div>';
    }).join("");
    return (
      '<div style="margin-top:24px;">' +
        '<h2 style="margin:0 0 4px; font-size:15px;">Неперевірні області <span class="faint" style="font-size:12px; font-weight:400;">' + areas.length + '</span></h2>' +
        '<p class="muted" style="margin:0 0 8px; font-size:12px;">AI не зміг надійно перевірити ці місця (тінь, перспектива, перекриття). Це НЕ помилки — вони не входять у метрики. Перегляньте вручну.</p>' +
        '<div class="disc-grid">' + cards + '</div>' +
      '</div>'
    );
  }
  function ReviewPage(runId) {
    var run = findRun(runId);
    if (!run) return "<p class='empty'>Перевірку не знайдено. <a href='#/'>До проєктів</a></p>";
    return (
      '<div>' +
        '<div class="row" style="justify-content:space-between; margin-bottom:8px;">' +
          '<div class="row" style="gap:10px;"><a href="#/" class="faint" style="font-size:11px;">&larr; На головну</a><h1 style="margin:0; font-size:17px;">Перевірка #' + run.id + '</h1></div>' +
          '<div class="row">' +
            '<button class="btn btn-sm" id="add-manual-btn">➕ Додати пропущену помилку</button>' +
            '<button class="btn btn-sm" id="export-csv-btn">⬇ Експорт CSV</button>' +
          '</div>' +
        '</div>' +
        '<div class="card" id="metrics-panel" style="margin-bottom:12px;"></div>' +
        '<div class="reviewtop">' +
          '<div id="drawing-panel"></div>' +
          '<div id="render-panel"></div>' +
        '</div>' +
        '<div style="margin-top:20px;">' +
          '<div class="row" style="justify-content:space-between; align-items:center; margin-bottom:8px; flex-wrap:wrap; gap:10px;">' +
            '<h2 style="margin:0; font-size:16px;">Знайдені невідповідності <span class="faint" id="disc-count" style="font-size:12px; font-weight:400;"></span></h2>' +
            '<div class="row" style="gap:8px; flex-wrap:wrap;">' +
              '<div class="filters" style="margin-bottom:0;">' +
                '<select id="filter-type"><option value="">Усі типи елементів</option>' + ELEMENT_TYPES.map(function(t){return '<option value="'+t+'">'+t.replace(/_/g," ")+'</option>';}).join("") + '</select>' +
                '<select id="filter-status"><option value="">Усі статуси</option>' + Object.keys(STATUS_LABEL).map(function(s){return '<option value="'+s+'">'+STATUS_LABEL[s]+'</option>';}).join("") + '</select>' +
              '</div>' +
              '<div class="row" style="gap:4px;"><button class="btn btn-sm" id="prev-btn">&larr; Попередня</button><button class="btn btn-sm" id="next-btn">Наступна &rarr;</button></div>' +
            '</div>' +
          '</div>' +
          '<div id="disc-list" class="disc-grid"></div>' +
        '</div>' +
        UncertainSection(run) +
        '<div class="row" style="justify-content:flex-end; margin-top:20px;">' +
          '<button class="btn btn-primary" id="next-run-btn">Наступна перевірка &rarr;</button>' +
        '</div>' +
        '<div id="modal-root"></div>' +
      '</div>'
    );
  }
  var reviewUi = {};
  function bindReviewPage(runId) {
    var run = findRun(runId);
    if (!run) return;
    if (reviewUi.runId !== runId) reviewUi = { runId: runId, activeId: null, filterType: "", filterStatus: "" };

    var siblingRuns = state.runs.filter(function (r) { return r.project_id === run.project_id; })
      .sort(function (a, b) { return new Date(b.created_at) - new Date(a.created_at); });
    var runIdx = siblingRuns.findIndex(function (r) { return r.id === runId; });
    var nextRun = (runIdx >= 0 && runIdx < siblingRuns.length - 1) ? siblingRuns[runIdx + 1] : null;
    var nextRunBtn = document.getElementById("next-run-btn");
    if (nextRun) {
      nextRunBtn.disabled = false;
      nextRunBtn.textContent = "Наступна перевірка →";
      nextRunBtn.onclick = function () { navigate("/run/" + nextRun.id); };
    } else {
      nextRunBtn.disabled = true;
      nextRunBtn.textContent = "Це остання перевірка в історії";
    }

    function currentList() {
      return discrepanciesOf(runId).filter(function (d) {
        return (!reviewUi.filterType || d.element_type === reviewUi.filterType) &&
               (!reviewUi.filterStatus || d.review_status === reviewUi.filterStatus);
      });
    }

    function repaint() {
      var renderAsset = findAsset(run.render_asset_id);
      var drawingAsset = findAsset(run.drawing_asset_id);
      var all = discrepanciesOf(runId);
      var list = currentList();
      if (!reviewUi.activeId && list[0]) reviewUi.activeId = list[0].id;

      document.getElementById("metrics-panel").innerHTML = MetricsHtml(calcMetrics(all));
      document.getElementById("drawing-panel").innerHTML = ImagePanel("Креслення", drawingAsset, all, "drawing_bbox", reviewUi.activeId);
      document.getElementById("render-panel").innerHTML = ImagePanel("Рендер", renderAsset, all, "render_bbox", reviewUi.activeId);
      document.getElementById("disc-count").textContent = list.length + " знайдено";
      document.getElementById("disc-list").innerHTML = list.length
        ? list.map(function (d) { return DiscCard(d, d.id === reviewUi.activeId); }).join("")
        : '<p class="empty">Немає результатів за поточними фільтрами.</p>';

      document.querySelectorAll("[data-select-disc]").forEach(function (el) {
        el.addEventListener("click", function (e) {
          if (e.target.closest("[data-stop-select]")) return;
          reviewUi.activeId = Number(el.dataset.selectDisc);
          repaint();
        });
        var hoverId = el.dataset.selectDisc;
        el.addEventListener("mouseenter", function () {
          document.querySelectorAll('rect[data-select-disc="' + hoverId + '"]').forEach(function (r) { r.classList.add("hovered"); });
        });
        el.addEventListener("mouseleave", function () {
          document.querySelectorAll('rect[data-select-disc="' + hoverId + '"]').forEach(function (r) { r.classList.remove("hovered"); });
        });
      });
      document.querySelectorAll("[data-review]").forEach(function (btn) {
        btn.onclick = function () {
          var id = Number(btn.dataset.review), status = btn.dataset.status;
          var d = state.discrepancies.find(function (x) { return x.id === id; });
          d.review_status = status; d.reviewed_at = new Date().toISOString();
          saveState();
          repaint();
        };
      });
    }

    document.getElementById("filter-type").onchange = function (e) { reviewUi.filterType = e.target.value; repaint(); };
    document.getElementById("filter-status").onchange = function (e) { reviewUi.filterStatus = e.target.value; repaint(); };
    document.getElementById("prev-btn").onclick = function () { step(-1); };
    document.getElementById("next-btn").onclick = function () { step(1); };
    function step(delta) {
      var list = currentList();
      if (!list.length) return;
      var idx = list.findIndex(function (d) { return d.id === reviewUi.activeId; });
      idx = (idx + delta + list.length) % list.length;
      reviewUi.activeId = list[idx].id;
      repaint();
    }

    document.getElementById("export-csv-btn").onclick = function () { exportCsv(runId); };
    document.getElementById("add-manual-btn").onclick = function () { openAddModal(runId, repaint); };

    repaint();
  }
  function MetricsHtml(m) {
    function stat(v, l, color) { return '<div class="stat"><div class="v" style="color:' + (color||"var(--text)") + ';">' + v + '</div><div class="l">' + l + '</div></div>'; }
    return '<div class="metrics">' +
      stat(m.precision.toFixed(2), "Precision", "var(--brand-700)") +
      stat(m.recall.toFixed(2), "Recall", "var(--brand-700)") +
      stat(m.f1.toFixed(2), "F1-score", "var(--brand-700)") +
      stat(m.tp, "TP", "var(--green)") +
      stat(m.fp, "FP", "var(--red)") +
      stat(m.fn, "FN", "var(--purple)") +
    '</div>';
  }

  function openAddModal(runId, onDone) {
    var root = document.getElementById("modal-root");
    root.innerHTML =
      '<div class="modal-backdrop" id="modal-backdrop">' +
        '<div class="modal">' +
          '<h3 style="margin:0 0 2px;">➕ Додати пропущену AI помилку (FN)</h3>' +
          '<p class="muted" style="margin:0 0 14px;">Ви знайшли невідповідність, яку AI не виявив.</p>' +
          '<div class="field"><label>Назва елемента</label><input type="text" id="m-name" placeholder="напр. Window W-07"></div>' +
          '<div class="grid2">' +
            '<div class="field"><label>Тип елемента</label><select id="m-type">' + ELEMENT_TYPES.map(function(t){return '<option value="'+t+'">'+t.replace(/_/g," ")+'</option>';}).join("") + '</select></div>' +
            '<div class="field"><label>Тип помилки</label><select id="m-error">' + Object.keys(ERROR_TYPE_LABEL).map(function(t){return '<option value="'+t+'">'+ERROR_TYPE_LABEL[t]+'</option>';}).join("") + '</select></div>' +
          '</div>' +
          '<div class="field"><label>Опис</label><textarea id="m-desc" rows="3" placeholder="Що саме не відповідає кресленню?"></textarea></div>' +
          '<div class="row" style="justify-content:flex-end;">' +
            '<button class="btn" id="m-cancel">Скасувати</button>' +
            '<button class="btn" style="background:var(--purple); border-color:var(--purple); color:#fff;" id="m-submit">Додати як FN</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    document.getElementById("m-cancel").onclick = function () { root.innerHTML = ""; };
    document.getElementById("modal-backdrop").onclick = function (e) { if (e.target.id === "modal-backdrop") root.innerHTML = ""; };
    document.getElementById("m-submit").onclick = function () {
      var name = document.getElementById("m-name").value.trim();
      var desc = document.getElementById("m-desc").value.trim();
      if (!name || !desc) { toast("Заповніть назву й опис."); return; }
      var id = nextId("discrepancy");
      state.discrepancies.push({
        id: id, run_id: runId,
        element_name: name,
        element_type: document.getElementById("m-type").value,
        error_type: document.getElementById("m-error").value,
        description: desc, confidence: 1.0,
        drawing_bbox: null, render_bbox: null,
        review_status: "fn", is_user_added: true,
        created_at: new Date().toISOString(), reviewed_at: new Date().toISOString()
      });
      saveState();
      root.innerHTML = "";
      reviewUi.activeId = id;
      onDone();
    };
  }

  function exportCsv(runId) {
    var discs = discrepanciesOf(runId);
    var m = calcMetrics(discs);
    var rows = [["id","element_name","element_type","error_type","description","confidence","review_status","is_user_added","created_at"]];
    discs.forEach(function (d) {
      rows.push([d.id, d.element_name, d.element_type, d.error_type, d.description, d.confidence, d.review_status, d.is_user_added, d.created_at]);
    });
    rows.push([]); rows.push(["Precision", m.precision.toFixed(4)]); rows.push(["Recall", m.recall.toFixed(4)]);
    rows.push(["F1", m.f1.toFixed(4)]); rows.push(["TP", m.tp]); rows.push(["FP", m.fp]); rows.push(["FN", m.fn]);
    var csv = rows.map(function (r) {
      return r.map(function (v) {
        var s = v == null ? "" : String(v);
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(",");
    }).join("\n");
    var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "run_" + runId + "_report.csv";
    document.body.appendChild(a); a.click(); a.remove();
  }

})();
</script>
